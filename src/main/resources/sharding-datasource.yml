# ShardingSphere 分库分表配置
# 2 库 × 4 表 = 8 片；分片键 short_code
# 注意：t_short_link 的 id 由号段发号器显式生成，此处不配 keyGenerateStrategy

mode:
  type: Standalone

dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/turbolink_db0?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: $${DB_PASSWORD::}
  ds_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/turbolink_db1?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: $${DB_PASSWORD::}

rules:
  - !SHARDING
    tables:
      t_short_link:
        actualDataNodes: ds_${0..1}.t_short_link_${0..3}
        databaseStrategy:
          standard:
            shardingColumn: short_code
            shardingAlgorithmName: short-code-db-inline
        tableStrategy:
          standard:
            shardingColumn: short_code
            shardingAlgorithmName: short-link-tb-inline
      t_link_access_stats:
        actualDataNodes: ds_${0..1}.t_link_access_stats_${0..3}
        databaseStrategy:
          standard:
            shardingColumn: short_code
            shardingAlgorithmName: short-code-db-inline
        tableStrategy:
          standard:
            shardingColumn: short_code
            shardingAlgorithmName: access-stats-tb-inline

    shardingAlgorithms:
      short-code-db-inline:
        type: INLINE
        props:
          # 库分片：hashCode 高位清零后取模。& 0x7fffffff 正确处理负数哈希
          # （等价 abs，但能正确处理 Integer.MIN_VALUE 边界）
          algorithm-expression: ds_${(short_code.hashCode() & 0x7fffffff) % 2}
      short-link-tb-inline:
        type: INLINE
        props:
          # 表分片：先用 intdiv(2) 做整数除法（Groovy 的 / 是浮点除法！），再取模
          algorithm-expression: t_short_link_${((short_code.hashCode() & 0x7fffffff).intdiv(2)) % 4}
      access-stats-tb-inline:
        type: INLINE
        props:
          algorithm-expression: t_link_access_stats_${((short_code.hashCode() & 0x7fffffff).intdiv(2)) % 4}

  # 单表：发号表 t_sequence 不分片，固定路由到 ds_0
  # 用 *.* 加载所有数据源中的所有非分片表为单表
  - !SINGLE
    tables:
      - "*.*"
    defaultDataSource: ds_0

props:
  sql-show: true
